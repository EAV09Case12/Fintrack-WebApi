spring.application.name=fintrack_webapi

# ===============================
# DATABASE LOCAL
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/fintrack
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:YzJmZjYyZjM0ZTRjYzQ1ZmE2OTc4YWJjZGVmMTIzNDU2Nzg5MDEyMzQ1Ng==}

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.rabbit=DEBUG

# ===============================
# REDIS
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true